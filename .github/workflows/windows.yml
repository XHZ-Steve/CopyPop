name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER=cl.exe
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Core tests
        run: ctest --preset release -R '^core$' --output-on-failure
      # The native UI suite requires an interactive unlocked desktop. Run locally.
